<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#1d2b26;--mu:#66756e;--pr:#2f7d62;--pr2:#e1f1ea;--wa:#b7791f;--wb:#fdf3de;--er:#b83a3a;--eb:#fbe5e5;--bd:#dbe4df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b18;--card:#1d2723;--tx:#e8f0ec;--mu:#9bb0a7;--pr:#5cc29e;--pr2:#23372f;--wa:#e5b455;--wb:#3a3122;--er:#ee8a8a;--eb:#3c2525;--bd:#2f3d37;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b18;--card:#1d2723;--tx:#e8f0ec;--mu:#9bb0a7;--pr:#5cc29e;--pr2:#23372f;--wa:#e5b455;--wb:#3a3122;--er:#ee8a8a;--eb:#3c2525;--bd:#2f3d37;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6;padding-bottom:78px}
header{padding:18px 16px 6px}
h1{margin:0;font-size:20px}
.sub{color:var(--mu);font-size:14px}
main{padding:8px 14px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.card h2{margin:0 0 8px;font-size:17px}
.al{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.al.w{background:var(--wb);color:var(--wa)}.al.e{background:var(--eb);color:var(--er)}.al.o{background:var(--pr2);color:var(--pr)}
label{display:block;font-size:13px;color:var(--mu);margin-top:8px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.g{background:var(--pr2);color:var(--pr)}button.d{background:var(--eb);color:var(--er)}
.add{width:100%;margin-top:12px}
.it{border-top:1px solid var(--bd);padding:10px 0}.it:first-child{border-top:0}
.it b{font-size:16px}.it small{display:block;color:var(--mu)}
.it .bt{display:flex;gap:8px;margin-top:6px}.it .bt button{padding:6px 12px;font-size:14px}
.done{opacity:.55}
.tag{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:20px;padding:0 10px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:9px 2px;font-size:12px}
nav button.on{color:var(--pr);font-weight:700}
nav span{display:block;font-size:20px}
.chk{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.chk input{width:22px;height:22px}
.big{font-size:30px;font-weight:700;color:var(--pr)}
.empty{color:var(--mu);text-align:center;padding:12px}
#sh table{width:100%;border-collapse:collapse;margin-top:14px}#sh td,#sh th{border:1.3px solid #000;padding:8px 6px;text-align:center;font-size:14px}#sh{font-family:inherit}
#sh table.tm td,#sh table.tm th{padding:1px 4px!important;line-height:1.25;font-size:13.5px!important}@page{size:A4 portrait;margin:5mm}@page cadp{size:A4 landscape;margin:5mm}.pg.cad{page:cadp}.pg.cad .fr{min-height:196mm}
.np{position:sticky;top:0;background:#fff;padding:8px;z-index:3;display:flex;gap:6px;flex-wrap:wrap}.pg{width:210mm;min-height:297mm;box-sizing:border-box;padding:5mm;background:#fff;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.45)}.fr{border:2px solid #000;padding:7px;min-height:285mm;display:flex;flex-direction:column}@media print{body>*:not(#sh){display:none!important}body{padding:0!important;background:#fff!important}.np{display:none}#sh{position:static!important;padding:0!important;background:#fff!important}#zw{width:auto!important;height:auto!important;overflow:visible!important}#zi{position:static!important;transform:none!important;width:auto!important}.pg{width:auto!important;min-height:0!important;margin:0!important;padding:0!important;box-shadow:none!important}.fr{min-height:285mm!important}#sh table:not(.fx) td,#sh table:not(.fx) th{padding:4px 4px!important;font-size:14.5px!important;font-weight:600}#sh table:not(.fx) th{font-weight:800}#sh img{height:70px!important}.pg.cad .fr{min-height:196mm!important}}

.dtb{display:flex;gap:5px;direction:rtl;width:100%;max-width:100%;min-width:0}
.dtb .db{flex:1;min-width:0;width:0;padding:8px 2px;text-align:center;font-size:15px;border-radius:9px;direction:ltr}
.dtb .db:focus{outline:2px solid var(--pr);outline-offset:0;border-color:var(--pr)}
.dtb .db.bad{border-color:var(--er);background:var(--eb)}
.vrr{border-top:1px solid var(--bd);padding:8px 0}.vrr:first-child{border-top:0}
.vrg{margin:12px 0 2px;font-weight:700}
.vrr small{display:block;color:var(--mu)}

.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;background:var(--card);color:var(--mu);border:1px solid var(--bd);padding:10px 4px;border-radius:12px;font-size:15px;font-weight:700}
.seg button small{display:block;font-weight:400;font-size:11px;margin-top:2px}
.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}

/* ===== تحسين الشكل: هادي ومنظم ومريح للعين ===== */
:root{--bg:#f3f6f4;--bd:#e0e8e3;--mu:#5f6f68;--sh:0 1px 3px rgba(31,60,48,.07)}
body{font-size:16.5px;line-height:1.7}
header{padding:20px 18px 8px;max-width:720px;margin:auto}
h1{font-size:21px;letter-spacing:0}
main{padding:6px 14px 14px}
.card{border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card h2{font-size:17px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
label{margin-top:12px;margin-bottom:4px;font-size:13.5px}
input,select,textarea{padding:12px;border-radius:12px;font-size:16px;min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:0;border-color:var(--pr)}
button{border-radius:12px;padding:12px 16px;min-height:44px;transition:opacity .15s}
button:active{opacity:.8}
.add{margin-top:16px;font-weight:700}
.it{padding:12px 0}

.al{border-radius:14px;padding:12px 14px;line-height:1.7}
.big{font-size:32px;line-height:1.2}
.seg{background:var(--pr2);padding:4px;border-radius:16px;gap:4px}

details.fold>summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:34px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"▾";color:var(--mu);transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(180deg)}
details.fold[open]>summary{border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:10px}
.bt2{width:100%;border-collapse:collapse;text-align:center}
.bt2 th,.bt2 td{border:1px solid var(--bd);padding:10px 6px}
.bt2 th{background:var(--pr2);color:var(--pr)}
.bt2 td:first-child{text-align:right;font-weight:700;background:var(--bg)}
.bt2 tr.rm td{font-weight:700;color:var(--pr);font-size:18px}
nav button{font-size:11.5px;line-height:1.3}

.vg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
button.vt{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:16px 8px 12px;font-weight:700;font-size:15px;line-height:1.4;box-shadow:var(--sh);min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
button.vt:active{background:var(--pr2)}
.vt .ic{font-size:38px;line-height:1}
.vt small{font-weight:400;color:var(--pr);background:var(--pr2);border-radius:20px;padding:0 10px;font-size:12px}
.mg{display:flex;align-items:center;gap:10px;margin:22px 2px 4px}
.mg .gi{width:42px;height:42px;border-radius:14px;background:var(--pr2);display:flex;align-items:center;justify-content:center;font-size:23px;flex:none;box-shadow:0 3px 0 var(--bd)}
.mg>div{flex:none}
.mg b{display:block;font-size:17px;color:var(--pr);line-height:1.3}
.mg small{display:block;color:var(--mu);font-size:12.5px;line-height:1.3}
.mg:after{content:"";flex:1;height:1px;background:var(--bd)}
.mgb{margin:2px 21px 0 0;padding:4px 12px 2px 0;border-right:3px solid var(--pr2)}
.mgb .vg{margin:6px 0 4px;gap:10px}
.mgb button.vt{min-height:96px;font-size:14.5px;padding:12px 6px 10px}
.mgb .vt .ic{font-size:32px}
.mgb .vg .vt:last-child:nth-child(odd){grid-column:1/-1}
.mg.w .gi{background:var(--wb)}.mg.w b{color:var(--wa)}.mgb.w{border-right-color:var(--wb)}
.mg.o .gi{background:var(--bg);border:1px solid var(--bd)}.mg.o b{color:var(--tx)}.mgb.o{border-right-color:var(--bd)}

(function(){
 function dg(v){return String(v==null?"":v).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/\D/g,"")}

function mcBase(){return lines(DEFMC).map(function(l){var p=l.split("|");return{n:norm(p[0]),j:norm(p[1]||""),g:+(p[2]||0)}})}
function mcK(n){return fz(norm(n)).replace(/\s+/g,"")}
function mcEff(){var B=mcBase(),M=S.mc=S.mc||{add:[],ign:{}};M.add=M.add||[];M.ign=M.ign||{};
var have={};B.forEach(function(x){have[mcK(x.n)]=1});M.add.forEach(function(x){have[mcK(x.n)]=1});
var its=S.items.filter(function(i){return i.kind==="mov"}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:String(a.id)<String(b.id)?-1:1});
var rem={},pend=[],back=[];
its.forEach(function(i){var k=mcK(i.name),t=i.type||"";
if(/^إخلاء طرف/.test(t)){if(have[k])rem[k]={n:i.name,t:t,d:i.date,id:i.id}}
else if(/بعد قطع|بعد انتهاء|بعد إلغاء/.test(t)){if(rem[k]){back.push({n:i.name,t:t,d:i.date});delete rem[k]}}
else if(/تعيين جديد/.test(t)){if(rem[k]){back.push({n:i.name,t:t,d:i.date});delete rem[k]}else if(!have[k]&&!M.ign[i.id]){pend.push(i)}}});
var gOf={};B.forEach(function(x){if(gOf[x.j]==null)gOf[x.j]=x.g});var all=B.map(function(x){return{n:x.n,j:x.j,g:x.g}}).concat(M.add.map(function(x){return{n:x.n,j:x.j,nw:1,id:x.id,g:gOf[x.j]==null?99:gOf[x.j]}}));
var live=[],gone=[];all.forEach(function(x){var r=rem[mcK(x.n)];r?gone.push({n:x.n,j:x.j,r:r}):live.push(x)});
return{live:live,gone:gone,pend:pend,back:back,base:B.length,add:M.add.length}}
function mcRoster(q){var E=mcEff(),qq=q?fz(q):"",G2={},order=[];
E.live.forEach(function(x){if(qq&&fz(x.n+" "+x.j).indexOf(qq)<0)return;(G2[x.j]=G2[x.j]||(order.push(x.j),[])).push(x)});
if(!order.length)return'<div class="empty">مفيش نتيجة</div>';
return order.map(function(j){var a=G2[j];return'<details'+(qq?" open":"")+' style="margin:6px 0"><summary style="cursor:pointer;font-weight:700">'+esc(j||"بدون وظيفة")+' <span class="tag">'+a.length+'</span></summary><div style="margin-top:4px">'+a.map(function(x,k){return'<div class="it" style="padding:6px 10px"><b>'+(k+1)+'.</b> '+esc(x.n)+(x.nw?' <span class="tag">إضافة</span> <button class="d" data-a="mcdel" data-id="'+esc(String(x.id))+'">حذف</button>':'')+'</div>'}).join("")+'</div></details>'}).join("")}
